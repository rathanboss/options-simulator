<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Payoff Matrix Dashboard</title>
    <style>
        /* Premium Deep Slate Dark Mode Interface Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }

        .dashboard-container {
            width: 100%;
            max-width: 850px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .header-area {
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
            margin: 0 0 4px 0;
        }

        .header-desc {
            font-size: 13px;
            color: #94a3b8;
            margin: 0;
        }

        /* Top Real-Time Value Counters Layout Matrix */
        .counters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
        }

        .counter-card h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin: 0 0 6px 0;
        }

        .counter-value {
            font-size: 26px;
            font-weight: 800;
            font-family: monospace;
        }

        /* Pure CSS Custom Graph Box Panel */
        .graph-panel {
            background-color: #1a2235;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            position: relative;
            height: 250px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Zero Reference Guideline */
        .zero-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        /* Interactive Graph Points */
        .graph-bar {
            flex: 1;
            margin: 0 1px;
            background-color: #38bdf8;
            min-height: 2px;
            z-index: 2;
            transition: height 0.1s ease;
        }

        /* Dynamic Indicator Line for Active Current Price */
        .price-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #a855f7;
            box-shadow: 0 0 8px #a855f7;
            z-index: 3;
            transition: left 0.1s ease;
        }

        /* Switch Strategy Toggles */
        .strategy-selector {
            display: flex;
            background-color: #1f2937;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .strat-btn {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .strat-btn.active-call {
            background-color: #0284c7;
            color: #ffffff;
        }

        .strat-btn.active-put {
            background-color: #dc2626;
            color: #ffffff;
        }

        /* Parameter Slider Blocks */
        .slider-group {
            margin-bottom: 18px;
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .slider-info span.val {
            font-family: monospace;
            color: #38bdf8;
            font-size: 15px;
            background-color: #1f2937;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .custom-range {
            width: 100%;
            height: 6px;
            background: #374151;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        .color-profit { color: #34d399; }
        .color-loss { color: #f87171; }
        .color-neutral { color: #ffffff; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header Section -->
        <div class="header-area">
            <h2 class="header-title">Custom Configuration Matrix</h2>
            <p class="header-desc">Adjust sliders below. The mathematical graph will render perfectly without any external internet links or dependencies.</p>
        </div>

        <!-- Top Real-Time Value Counters Matrix -->
        <div class="counters-grid">
            <div class="counter-card">
                <h3>Underlying Price</h3>
                <div id="statUnderlying" class="counter-value color-neutral">$95.00</div>
            </div>
            <div class="counter-card">
                <h3>Intrinsic Value</h3>
                <div id="statIntrinsic" class="counter-value color-neutral">$0.00</div>
            </div>
            <div class="counter-card">
                <h3>Net Profit/Loss</h3>
                <div id="statNetPnL" class="counter-value color-loss">-$10.00</div>
            </div>
        </div>

        <!-- Independent Native HTML/CSS Bar Graph -->
        <div class="graph-panel" id="customGraph">
            <div class="zero-line"></div>
            <div class="price-marker" id="activeMarker"></div>
            <!-- Dynamic Graph bars are injected here automatically by Javascript -->
        </div>

        <!-- Interactive Settings Configuration Controls -->
        <div style="border-top: 1px solid #1f2937; padding-top: 20px;">
            <h3 style="font-size: 13px; color: #94a3b8; text-transform: uppercase; margin: 0 0 10px 0;">Option Type Strategy</h3>
            
            <div class="strategy-selector">
                <button id="btnCall" onclick="changeStrategy('call')" class="strat-btn active-call">Call Option (Right to Buy)</button>
                <button id="btnPut" onclick="changeStrategy('put')" class="strat-btn">Put Option (Right to Sell)</button>
            </div>

            <!-- Slider 1: Live Sweep Asset Price -->
            <div class="slider-group">
                <div class="slider-info">
                    <label for="slideUnderlying">Live Underlying Market Asset Price Sweep:</label>
                    <span id="labelUnderlying" class="val">$95</span>
                </div>
                <input type="range" id="slideUnderlying" min="0" max="200" value="95" oninput="executeRecalculation()" class="custom-range">
            </div>

            <!-- Slider 2: Locked Target Strike -->
            <div class="slider-group">
                <div class="slider-info">
                    <label for="slideStrike">Locked Strike Price ($):</label>
                    <span id="labelStrike" class="val">$100</span>
                </div>
                <input type="range" id="slideStrike" min="40" max="160" value="100" oninput="executeRecalculation()" class="custom-range">
            </div>

            <!-- Slider 3: Premium Fee Paid -->
            <div class="slider-group">
                <div class="slider-info">
                    <label for="slidePremium">Upfront Premium Cost ($):</label>
                    <span id="labelPremium" class="val">$10</span>
                </div>
                <input type="range" id="slidePremium" min="0" max="40" value="10" oninput="executeRecalculation()" class="custom-range">
            </div>
        </div>

    </div>

    <!-- Self-Contained Native Script Engine -->
    <script>
        let currentStrategy = 'call';
        const totalBars = 50; // Resolution grid mapping count
        
        // Generate physical native graph DOM bars layout once on setup
        const graphContainer = document.getElementById('customGraph');
        for (let i = 0; i < totalBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'graph-bar';
            bar.id = 'bar-' + i;
            graphContainer.appendChild(bar);
        }

        function changeStrategy(mode) {
            currentStrategy = mode;
            const btnCall = document.getElementById('btnCall');
            const btnPut = document.getElementById('btnPut');

            if (mode === 'call') {
                btnCall.className = "strat-btn active-call";
                btnPut.className = "strat-btn";
            } else {
                btnCall.className = "strat-btn";
                btnPut.className = "strat-btn active-put";
            }
            executeRecalculation();
        }

        function executeRecalculation() {
            const underlying = parseInt(document.getElementById('slideUnderlying').value);
            const strike = parseInt(document.getElementById('slideStrike').value);
